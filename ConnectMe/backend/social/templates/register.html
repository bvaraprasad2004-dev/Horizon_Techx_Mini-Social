<!DOCTYPE html>
<html>
<head>
    <title>Register - ConnectMe</title>
</head>

<body>

<h1>🌐 ConnectMe</h1>

<h2>Create Account</h2>

<form method="POST">

    {% csrf_token %}

    <input 
        type="text" 
        name="username" 
        placeholder="Username"
        required
    >

    <br>

    <input 
        type="email" 
        name="email" 
        placeholder="Email Address"
        required
    >

    <br>

    <input 
        type="password" 
        name="password" 
        placeholder="Password"
        required
    >

    <br>

    <button type="submit">
        Register
    </button>

</form>


{% if error %}
<p>{{ error }}</p>
{% endif %}


</body>
</html>
