<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | ConnectMe</title>

<link rel="stylesheet" href="css/profile.css">

<link rel="stylesheet"

<body>

<nav>
